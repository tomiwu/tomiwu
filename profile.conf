# Profile README config, read by scripts/UpdateReadme.scala
# Comma-separated repo names. Lines starting with # are comments.

# Never show these (profile repo, old projects)
exclude = tomiwu, stereo-opus, pyicloud-photo-upload

# Always shown first, in this order (still must be your own public repo)
pinned =

# Featured: max entries and activity window in months
featured.max = 6
featured.months = 12

# Per-repo overrides (used instead of the GitHub description/language)
description.mowa = On-device Polish/English dictation keyboard for iOS (Swift/SwiftUI)
language.mowa = Swift
